[project]
name = "topchef-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "httpx",
    "uvicorn",
    "SQLAlchemy[asyncio]",
    "pydantic",
    "psycopg2-binary",
    "pydantic-settings",
    "python-jose[cryptography]",
    "passlib",
    "bcrypt==4.0.1",
    "python-json-logger",
    "asyncpg",
    "redis"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI evaluates these declarations once while building the dependency graph.
# They are intentional framework metadata, not stateful Python defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "app.modules.infrastructure.dependencies.require_capability",
    "app.modules.infrastructure.dependencies.require_role",
    "app.modules.infrastructure.middlewares.role_guard.require_capability",
    "app.modules.infrastructure.middlewares.role_guard.require_role",
]
